---
# Layer 4 — cross-reference: action references an undeclared trigger.
manifestVersion: "1"
id: unresolved-trigger
version: 1.0.0
name: Unresolved Trigger
category: comms
description: An action wired to a trigger that is not declared.
publisher:
  id: tommy-labs
  name: Tommy Labs
  type: first_party
triggers:
  thing_happened:
    description: Emitted when a thing happens.
    emission: async
    payloadSchema:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
activities:
  record_thing:
    description: Persist a thing.
    callerPolicy: first_party
    sideEffect: local_write
    idempotency: derived_from_input
    offlineReplayable: false
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
    resultSchema:
      type: object
      properties:
        thingId: { type: string }
    authorizedCallers: []
actions:
  record_on_thing:
    title: Record thing
    description: When a thing happens, save it.
    trigger:
      name: ghost_trigger   # BREAK: no such declared trigger/interaction
    activity:
      name: record_thing
    enabledByDefault: true
    required: true
    userConfigurable: false
